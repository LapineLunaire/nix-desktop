name: Update

# Leave a buffer after the servers' 03:00 UTC upgrades, which can restart this runner.
# The schedule does not wait for upgrades; the lock update waits for the Tibia job.
# The shared runner has capacity 1, so overlapping server and desktop jobs queue.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  tibia:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Match fetchurl's Accept-Encoding handling and refresh the unversioned download.
      - name: Update hash
        id: tibia
        run: |
          hash=$(nix-prefetch-url https://static.tibia.com/download/tibia.x64.tar.gz)
          sed -i "s|sha256 = \"[a-z0-9]*\";|sha256 = \"${hash}\";|" pkgs/tibia/default.nix
          if git diff --quiet pkgs/tibia/default.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.tibia.outputs.changed == 'true'
        run: nix build .#tibia --no-link

      - name: Commit and push
        if: steps.tibia.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: pkgs/tibia/default.nix
          message: "tibia: update client hash"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}
          push-token: ${{ github.token }}

  update:
    needs: tibia
    runs-on: nixos
    steps:
      # ref rather than the triggering SHA, so this job sees the commit the tibia job just pushed.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Build Linux; macOS can only be evaluated on this runner.
      - name: Build
        id: build
        if: steps.check.outputs.changed == 'true'
        run: |
          path=$(nix build --no-link --print-out-paths .#nixosConfigurations.camellya.config.system.build.toplevel)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          nix eval ".#darwinConfigurations.silverwolf.config.system.build.toplevel.drvPath"

      - name: Push to the cache
        if: steps.check.outputs.changed == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          STORE_PATH: ${{ steps.build.outputs.path }}
        run: |
          # Cache uploads are optional until the token is configured.
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "ATTIC_TOKEN not set, skipping push"
            exit 0
          fi
          # Attic stores its token in cleartext. Restrict access and remove it on success or failure.
          umask 077
          export XDG_CONFIG_HOME
          XDG_CONFIG_HOME=$(mktemp -d "$RUNNER_TEMP/attic-config.XXXXXX")
          trap 'rm -rf -- "$XDG_CONFIG_HOME"' EXIT
          attic login lunaire https://cache.lunaire.moe/ "$ATTIC_TOKEN"
          unset ATTIC_TOKEN
          attic push lunaire:desktop "$STORE_PATH"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: flake.lock
          message: "flake: update inputs"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}
          push-token: ${{ github.token }}
